<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a2540" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Vinyl Grooves Gradient -->
    <radialGradient id="vinyl-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="24" fill="url(#bg-grad)" />

  <!-- Outer Vinyl Glow & Disc -->
  <circle cx="200" cy="180" r="130" fill="url(#vinyl-grad)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="200" cy="180" r="110" fill="none" stroke="#a855f7" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 2" />
  <circle cx="200" cy="180" r="90" fill="none" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="200" cy="180" r="70" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Center Disc Glow -->
  <circle cx="200" cy="180" r="50" fill="url(#accent-grad)" filter="url(#glow)" opacity="0.85" />
  <circle cx="200" cy="180" r="46" fill="#0f172a" />
  <circle cx="200" cy="180" r="16" fill="url(#accent-grad)" />
  <circle cx="200" cy="180" r="6" fill="#ffffff" />

  <!-- Animated-style Waveform Bars (Decorative) -->
  <g fill="url(#accent-grad)" opacity="0.9">
    <rect x="130" y="270" width="6" height="24" rx="3" />
    <rect x="144" y="260" width="6" height="34" rx="3" />
    <rect x="158" y="250" width="6" height="44" rx="3" />
    <rect x="172" y="240" width="6" height="54" rx="3" />
    <rect x="186" y="235" width="6" height="59" rx="3" />
    <rect x="200" y="230" width="6" height="64" rx="3" />
    <rect x="214" y="235" width="6" height="59" rx="3" />
    <rect x="228" y="242" width="6" height="52" rx="3" />
    <rect x="242" y="252" width="6" height="42" rx="3" />
    <rect x="256" y="262" width="6" height="32" rx="3" />
    <rect x="270" y="272" width="6" height="22" rx="3" />
  </g>

  <!-- Typography -->
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1.5">
    PulsePlay
  </text>
  <text x="200" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="2">
    DEFAULT ALBUM ART
  </text>
</svg>
